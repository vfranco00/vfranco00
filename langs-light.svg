<svg xmlns="http://www.w3.org/2000/svg" width="495" height="200" viewBox="0 0 495 200" role="img" aria-label="Linguagens mais usadas">
  <title>Linguagens mais usadas</title>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .h { fill: #1f2328; font-size: 17px; font-weight: 700; }
    .l { fill: #24292f; font-size: 13.5px; }
    .m { fill: #57606a; font-size: 12px; }
    .v { fill: #1f2328; font-size: 14px; font-weight: 700; font-family: 'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .in { opacity: 0; animation: in .5s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .in { opacity: 1; } }
    .grow { transform-origin: 25px 59px; transform: scaleX(0); animation: grow 1.1s ease-out .1s forwards; } @keyframes grow { to { transform: scaleX(1); } } @media (prefers-reduced-motion: reduce) { .grow { transform: none; } }
  </style>
  <rect x="0.5" y="0.5" width="494" height="199" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text class="h" x="25" y="36">Linguagens mais usadas</text>
  <clipPath id="bar"><rect x="25" y="54" width="445" height="10" rx="5"/></clipPath>
  <rect x="25" y="54" width="445" height="10" rx="5" fill="#eaeef2"/>
  <g clip-path="url(#bar)" class="grow"><rect x="25.0" y="54" width="251.4" height="10" fill="#3572A5"/><rect x="275.9" y="54" width="179.7" height="10" fill="#3178c6"/><rect x="455.1" y="54" width="8.6" height="10" fill="#f1e05a"/><rect x="463.2" y="54" width="5.8" height="10" fill="#b07219"/><rect x="468.5" y="54" width="1.5" height="10" fill="#a52a22"/><rect x="469.5" y="54" width="1.0" height="10" fill="#A97BFF"/></g>
  <g class="in" style="animation-delay:0.30s"><circle cx="31" cy="92" r="6" fill="#3572A5"/><text class="l" x="45" y="96">Python</text><text class="m" x="230" y="96" text-anchor="end">56.4%</text></g>
  <g class="in" style="animation-delay:0.40s"><circle cx="261" cy="92" r="6" fill="#3178c6"/><text class="l" x="275" y="96">TypeScript</text><text class="m" x="460" y="96" text-anchor="end">40.3%</text></g>
  <g class="in" style="animation-delay:0.50s"><circle cx="31" cy="124" r="6" fill="#f1e05a"/><text class="l" x="45" y="128">JavaScript</text><text class="m" x="230" y="128" text-anchor="end">1.8%</text></g>
  <g class="in" style="animation-delay:0.60s"><circle cx="261" cy="124" r="6" fill="#b07219"/><text class="l" x="275" y="128">Java</text><text class="m" x="460" y="128" text-anchor="end">1.2%</text></g>
  <g class="in" style="animation-delay:0.70s"><circle cx="31" cy="156" r="6" fill="#a52a22"/><text class="l" x="45" y="160">Jinja</text><text class="m" x="230" y="160" text-anchor="end">0.2%</text></g>
  <g class="in" style="animation-delay:0.80s"><circle cx="261" cy="156" r="6" fill="#A97BFF"/><text class="l" x="275" y="160">Kotlin</text><text class="m" x="460" y="160" text-anchor="end">0.1%</text></g>
</svg>
