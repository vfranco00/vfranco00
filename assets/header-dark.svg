<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Victor Franco — Full Stack Developer">
  <title>Victor Franco — Full Stack Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2a3a" stroke-width="1"/>
    </pattern>
    <mask id="fade">
      <linearGradient id="fadeg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity="1"/>
      </linearGradient>
      <rect width="1000" height="280" fill="url(#fadeg)"/>
    </mask>
    <clipPath id="card"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .hello { fill: #8b949e; font-size: 18px; opacity: 0; animation: up .7s ease-out .1s forwards; }
    .name { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; font-size: 64px; font-weight: 800; letter-spacing: -1.5px; opacity: 0; animation: up .8s ease-out .3s forwards; }
    .role { fill: #e6edf3; font-size: 22px; font-weight: 600; opacity: 0; animation-name: cycle; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .prompt { fill: #38bdf8; font-size: 22px; font-weight: 700; }
    .chip { opacity: 0; animation: up .6s ease-out forwards; }
    .chip-t { fill: #8b949e; font-size: 13px; }
    .orbit { transform-origin: 800px 140px; animation: spin 24s linear infinite; }
    .orbit2 { transform-origin: 800px 140px; animation: spin 36s linear infinite reverse; }
    .float1 { animation: drift 9s ease-in-out infinite; }
    .float2 { animation: drift 12s ease-in-out infinite reverse; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(10px); }
      3.0% { opacity: 1; transform: translateY(0); }
      21.2% { opacity: 1; transform: translateY(0); }
      25.0% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,18px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .hello, .name, .chip { opacity: 1; }
      .role:first-of-type { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)" mask="url(#fade)"/>
    <circle class="float1" cx="820" cy="60" r="190" fill="url(#orb1)"/>
    <circle class="float2" cx="960" cy="260" r="170" fill="url(#orb2)"/>

    <!-- Órbitas decorativas -->
    <g class="orbit" fill="none" stroke="#38bdf8" stroke-opacity="0.35">
      <ellipse cx="800" cy="140" rx="120" ry="120" stroke-dasharray="4 10"/>
      <circle cx="920" cy="140" r="6" fill="#38bdf8" stroke="none"/>
    </g>
    <g class="orbit2" fill="none" stroke="#818cf8" stroke-opacity="0.3">
      <ellipse cx="800" cy="140" rx="78" ry="78"/>
      <circle cx="800" cy="62" r="5" fill="#818cf8" stroke="none"/>
    </g>
    <text x="800" y="152" text-anchor="middle" font-size="34" font-weight="700" fill="url(#name)">&lt;/&gt;</text>

    <text class="hello" x="80" y="70">// olá, mundo — eu sou</text>
    <text class="name" x="76" y="134" fill="url(#name)">Victor Franco</text>

    <text class="prompt" x="52" y="176">›</text>
    <text class="role" x="80" y="176" style="animation-delay:0s;animation-duration:12s">Full Stack Developer</text>
    <text class="role" x="80" y="176" style="animation-delay:3s;animation-duration:12s">TypeScript • Next.js • Supabase</text>
    <text class="role" x="80" y="176" style="animation-delay:6s;animation-duration:12s">Dados, Automação e APIs</text>
    <text class="role" x="80" y="176" style="animation-delay:9s;animation-duration:12s">LLMs • Prompts • MCP • Claude Code</text>

    <g class="chip" style="animation-delay:0.90s"><rect x="80" y="206" width="79" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="120" y="226" text-anchor="middle" class="chip-t">Next.js</text></g>
    <g class="chip" style="animation-delay:1.02s"><rect x="169" y="206" width="104" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="221" y="226" text-anchor="middle" class="chip-t">TypeScript</text></g>
    <g class="chip" style="animation-delay:1.14s"><rect x="283" y="206" width="88" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="327" y="226" text-anchor="middle" class="chip-t">Supabase</text></g>
    <g class="chip" style="animation-delay:1.26s"><rect x="381" y="206" width="71" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="417" y="226" text-anchor="middle" class="chip-t">Python</text></g>
    <g class="chip" style="animation-delay:1.38s"><rect x="462" y="206" width="112" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="518" y="226" text-anchor="middle" class="chip-t">Claude Code</text></g>
    <g class="chip" style="animation-delay:1.50s"><rect x="584" y="206" width="47" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="608" y="226" text-anchor="middle" class="chip-t">MCP</text></g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="279" rx="18" fill="none" stroke="#30363d"/>
</svg>
